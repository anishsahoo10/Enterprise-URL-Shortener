server:
  port: 8080

spring:
  application:
    name: url-shortener-test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: localhost
      port: 6379

app:
  base-url: http://localhost:8080
  cache:
    enabled: true
    ttl-seconds: 1800

management:
  endpoints:
    web:
      exposure:
        include: health
