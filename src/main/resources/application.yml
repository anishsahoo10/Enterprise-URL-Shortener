server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: url-shortener

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:urlshortener}}
    username: ${DB_USERNAME:urlapp}
    password: ${DB_PASSWORD:urlpass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      connect-timeout: 2000ms

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cache:
    enabled: ${APP_CACHE_ENABLED:true}
    ttl-seconds: ${URL_CACHE_TTL_SECONDS:1800}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.example.urlshortener: INFO
