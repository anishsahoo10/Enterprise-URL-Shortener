server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: url-shortener
  profiles:
    default: dev

  jpa:
    open-in-view: false
    show-sql: false

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.example.urlshortener: INFO
